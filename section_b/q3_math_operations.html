<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JS Q3: Mathematical Operations</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }
        input, button {
            padding: 6px;
            font-size: 16px;
            margin-right: 10px;
        }
        #results {
            margin-top: 20px;
            font-size: 16px;
            line-height: 1.8;
        }
    </style>
</head>
<body>
    <h2>Mathematical Operations on Two Variables</h2>
    <label>Variable A: </label>
    <input type="number" id="numA" value="10">
    <label>Variable B: </label>
    <input type="number" id="numB" value="5">
    <button onclick="performOperations()">Calculate</button>

    <div id="results"></div>
    <br>
    <a href="../index.html">&larr; Back to Main Index</a>

    <script>
        function performOperations() {
            let a = parseFloat(document.getElementById("numA").value);
            let b = parseFloat(document.getElementById("numB").value);

            let add = a + b;
            let sub = a - b;
            let mul = a * b;
            let div = b !== 0 ? (a / b) : "Cannot divide by zero";
            let sqA = a * a;
            let sqB = b * b;

            document.getElementById("results").innerHTML =
                "<strong>Addition:</strong> " + a + " + " + b + " = " + add + "<br>" +
                "<strong>Subtraction:</strong> " + a + " - " + b + " = " + sub + "<br>" +
                "<strong>Multiplication:</strong> " + a + " &times; " + b + " = " + mul + "<br>" +
                "<strong>Division:</strong> " + a + " / " + b + " = " + div + "<br>" +
                "<strong>Square of A:</strong> " + a + "&sup2; = " + sqA + "<br>" +
                "<strong>Square of B:</strong> " + b + "&sup2; = " + sqB;
        }
    </script>
</body>
</html>
