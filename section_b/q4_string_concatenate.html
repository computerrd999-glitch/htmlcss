<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JS Q4: String Concatenation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }
        button {
            padding: 8px 15px;
            font-size: 16px;
            cursor: pointer;
        }
        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #0066cc;
        }
    </style>
</head>
<body>
    <h2>Concatenate Two Strings</h2>
    <p>String 1: "Today is"</p>
    <p>String 2: "Raining"</p>

    <button onclick="concatStrings()">Concatenate</button>

    <div id="result"></div>
    <br>
    <a href="../index.html">&larr; Back to Main Index</a>

    <script>
        function concatStrings() {
            let str1 = "Today is";
            let str2 = "Raining";
            let result = str1 + " " + str2;
            document.getElementById("result").innerText = "Result: " + result;
        }
    </script>
</body>
</html>
