<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JS Q7: Largest of Three Numbers</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }
        input, button {
            padding: 6px;
            font-size: 16px;
            margin-right: 8px;
        }
        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #0066cc;
        }
    </style>
</head>
<body>
    <h2>Find Largest Among Three Numbers</h2>
    <label>Number 1: </label>
    <input type="number" id="num1" value="25">
    <label>Number 2: </label>
    <input type="number" id="num2" value="78">
    <label>Number 3: </label>
    <input type="number" id="num3" value="45">
    <button onclick="findLargest()">Find Largest</button>

    <div id="result"></div>
    <br>
    <a href="../index.html">&larr; Back to Main Index</a>

    <script>
        function findLargest() {
            let n1 = parseFloat(document.getElementById("num1").value);
            let n2 = parseFloat(document.getElementById("num2").value);
            let n3 = parseFloat(document.getElementById("num3").value);

            let largest;
            if (n1 >= n2 && n1 >= n3) {
                largest = n1;
            } else if (n2 >= n1 && n2 >= n3) {
                largest = n2;
            } else {
                largest = n3;
            }

            document.getElementById("result").innerText = "Largest Number is: " + largest;
        }
    </script>
</body>
</html>
