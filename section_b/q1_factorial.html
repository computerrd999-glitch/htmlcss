<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JS Q1: Factorial of a Number</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }
        input, button {
            padding: 8px;
            font-size: 16px;
        }
        #result {
            margin-top: 20px;
            font-weight: bold;
            font-size: 18px;
            color: #0066cc;
        }
    </style>
</head>
<body>
    <h2>Calculate Factorial</h2>
    <label>Enter a Number: </label>
    <input type="number" id="num" min="0">
    <button onclick="calculateFactorial()">Calculate</button>

    <div id="result"></div>
    <br>
    <a href="../index.html">&larr; Back to Main Index</a>

    <script>
        function calculateFactorial() {
            let n = parseInt(document.getElementById("num").value);
            if (isNaN(n) || n < 0) {
                document.getElementById("result").innerText = "Please enter a non-negative integer.";
                return;
            }
            let fact = 1;
            for (let i = 1; i <= n; i++) {
                fact = fact * i;
            }
            document.getElementById("result").innerText = "Factorial of " + n + " is: " + fact;
        }
    </script>
</body>
</html>
