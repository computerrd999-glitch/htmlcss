<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JS Q5: Display URL of HTML File</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }
        button {
            padding: 8px 15px;
            font-size: 16px;
            cursor: pointer;
        }
        #result {
            margin-top: 20px;
            font-size: 16px;
            color: #0066cc;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <h2>Display Page URL</h2>
    <button onclick="showURL()">Show URL</button>

    <div id="result"></div>
    <br>
    <a href="../index.html">&larr; Back to Main Index</a>

    <script>
        function showURL() {
            let currentURL = window.location.href;
            document.getElementById("result").innerHTML = "<strong>Page URL:</strong> " + currentURL;
        }
    </script>
</body>
</html>
