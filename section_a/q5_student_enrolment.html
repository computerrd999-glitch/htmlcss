<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q5: Student Enrolment Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f4f4f4;
        }
        .form-box {
            width: 450px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        h2 {
            text-align: center;
        }
        table {
            width: 100%;
        }
        td {
            padding: 6px;
        }
        input[type="text"], input[type="email"], input[type="tel"], select, textarea {
            width: 100%;
            padding: 6px;
            box-sizing: border-box;
        }
        .center {
            text-align: center;
            margin-top: 15px;
        }
        input[type="submit"], input[type="reset"] {
            padding: 8px 15px;
            cursor: pointer;
        }
        a {
            color: #0066cc;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="form-box">
        <h2>Certificate Course Enrolment Form</h2>
        <form action="#" method="post">
            <table>
                <tr>
                    <td>Name:</td>
                    <td><input type="text" name="name" placeholder="Enter your full name" required></td>
                </tr>
                <tr>
                    <td>Address:</td>
                    <td><textarea name="address" rows="3" placeholder="Enter full address" required></textarea></td>
                </tr>
                <tr>
                    <td>Mobile Number:</td>
                    <td><input type="tel" name="mobile" placeholder="Enter 10-digit mobile number" required></td>
                </tr>
                <tr>
                    <td>Gender:</td>
                    <td>
                        <input type="radio" name="gender" value="Male" required> Male
                        <input type="radio" name="gender" value="Female"> Female
                        <input type="radio" name="gender" value="Other"> Other
                    </td>
                </tr>
                <tr>
                    <td>State:</td>
                    <td>
                        <select name="state" required>
                            <option value="">-- Select State --</option>
                            <option value="West Bengal">West Bengal</option>
                            <option value="Bihar">Bihar</option>
                            <option value="Delhi">Delhi</option>
                            <option value="Maharashtra">Maharashtra</option>
                            <option value="Tamil Nadu">Tamil Nadu</option>
                            <option value="Other">Other</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>Email ID:</td>
                    <td><input type="email" name="email" placeholder="Enter email address" required></td>
                </tr>
                <tr>
                    <td>Last Attended Institution:</td>
                    <td><input type="text" name="institution" placeholder="Enter school or college name" required></td>
                </tr>
                <tr>
                    <td>Qualification:</td>
                    <td><input type="text" name="qualification" placeholder="Enter highest qualification" required></td>
                </tr>
                <tr>
                    <td colspan="2" class="center">
                        <input type="submit" value="Submit Enrolment">
                        <input type="reset" value="Clear">
                    </td>
                </tr>
            </table>
        </form>
        <div class="center">
            <a href="../index.html">&larr; Back to Main Index</a>
        </div>
    </div>
</body>
</html>
